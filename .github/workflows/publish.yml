# Stages @veyforma/charts on npm when a GitHub Release is published.
# Uses npm trusted publishing (OIDC): no npm token or 2FA code is stored anywhere.
# The staged version goes public after a maintainer approves it on npmjs.com
# (profile → Staged Packages → Approve) with 2FA.
# Set up once on npmjs.com: package Settings → Trusted Publisher → GitHub Actions
#   user: Veyforma · repository: veyforma-charts · workflow: publish.yml
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # lets GitHub prove to npm that this workflow is publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest

      - name: Check the release tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag v$TAG does not match package.json version $VERSION. Update package.json first."
            exit 1
          fi

      - run: npm install

      - run: npm run build

      # Staged, not public yet: approve it on npmjs.com
      - run: npm stage publish
